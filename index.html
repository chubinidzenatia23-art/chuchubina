        let currentLang = 'ka';
        let activeType = 'all';
        let activeCategory = 'all';

        function renderListings() {
            const grid = document.getElementById('listingsGrid');
            grid.innerHTML = '';

            const filtered = listings.filter(item => {
                const matchType = activeType === 'all' || item.type === activeType;
                const matchCategory = activeCategory === 'all' || item.category === activeCategory;
                return matchType && matchCategory;
            });

            filtered.forEach(item => {
                const title = item.title[currentLang] || item.title['en'];
                const loc = item.location[currentLang] || item.location['en'];
                const desc = item.desc[currentLang] || item.desc['en'];
                const bookText = i18n[currentLang].bookNow;

                grid.innerHTML += `
                    <div class="card">
                        <div class="card-img" style="background-image: url('${item.img}')">
                            <span class="badge">${item.type === 'georgia' ? 'GEORGIA' : 'GLOBAL'}</span>
                        </div>
                        <div class="card-content">
                            <h3 class="card-title">${title}</h3>
                            <div class="card-loc"><i class="fa-solid fa-location-dot"></i> ${loc}</div>
                            <div class="history-box">
                                <i class="fa-solid fa-circle-info"></i> ${desc}
                            </div>
                            <div class="card-footer">
                                <div class="price">${item.price} <span>${item.unit}</span></div>
                                <button class="btn-book" onclick="alert('Booking started!')">${bookText}</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function setLanguage(lang) {
            currentLang = lang;
            const flags = { ka: '🇬🇪 ქართული', en: '🇬🇧 English', de: '🇩🇪 Deutsch', es: '🇪🇸 Español', fr: '🇫🇷 Français', ru: '🇷🇺 Русский' };
            document.getElementById('currentLang').innerText = flags[lang];
            document.getElementById('langDropdown').classList.remove('show');

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang][key]) el.innerText = i18n[lang][key];
            });

            renderListings();
        }

        function toggleLangDropdown() {
            document.getElementById('langDropdown').classList.toggle('show');
        }

        function filterType(type, btn) {
            activeType = type;
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderListings();
        }

        function filterCategory(cat, btn) {
            activeCategory = cat;
            document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderListings();
        }

        renderListings();
    </script>
